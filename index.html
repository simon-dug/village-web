<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- Seuls ce site, la connexion Google et l'API Drive sont permis. Aucune donnée n'est dans cette page :
     l'état est lu dans le Drive de la personne connectée. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>L'île</title>
<link rel="stylesheet" href="ile.css">
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
<div id="scene"></div>
<div id="etiquettes"></div>
<header id="bandeau">
  <strong>L'île</strong>
  <span id="resume"></span>
  <span id="maj" hidden></span>
  <button id="btn-deconnexion" class="lien" hidden>Se déconnecter</button>
</header>
<aside id="panneau" hidden tabindex="-1" aria-label="Dossier"></aside>
<div id="bulle" hidden></div>
<div id="legende">
  <span><i class="l eteinte"></i>calme</span>
  <span><i class="l douce"></i>bientôt</span>
  <span><i class="l ambre"></i>pressant</span>
  <span><i class="l rouge"></i>urgent</span>
  <span><b class="q">?</b>pas de plan</span>
</div>
<div id="chargement">Chargement…</div>
<div id="connexion" hidden>
  <div class="carte-connexion">
    <h1>L'île</h1>
    <p>Connectez-vous avec votre compte Google pour voir l'état de vos dossiers.</p>
    <button id="btn-connexion" class="bouton principal">Se connecter avec Google</button>
    <p id="connexion-message" class="p-remarque"></p>
    <p class="p-discret">Connexion valable environ une heure, gardée en mémoire seulement. Sur un poste partagé, pensez à vous déconnecter.</p>
  </div>
</div>
<script src="ile.js"></script>
</body>
</html>
